; OStimAnchorAlign - corrects OStim scene alignment for actors whose height differs
; from the animation's reference height (1.0), per action type:
; intercourse keeps the hips together, kissing the faces, oral the face and the groin, ...
; Rules live in OStimAnchorAlign/anchors.json.
; This file is re-read on every OStim scene change, so you can edit it while the game runs.

[General]
; 1 = on, 0 = off (offsets fade out at the next scene change)
bEnabled = 1

; hotkey that pauses/resumes all corrections in game (DirectInput scan codes).
; While paused the skeleton is left untouched, e.g. for posing with Fabulous Poser.
; iPauseKey: 0 = no hotkey. 0xC5 = Pause/Break, 0x46 = Scroll Lock, 0xCF = End, 0xC7 = Home
; iPauseModifier: key that must be held at the same time, 0 = none.
;   0x2A = Left Shift, 0x36 = Right Shift, 0x1D = Left Ctrl, 0x38 = Left Alt
iPauseKey = 0xC5
iPauseModifier = 0x2A

; language of the in-game settings page (SKSE Menu Framework, optional):
; 0 = game language, 1 = English, 2 = Japanese
iLanguage = 0

; count high-heel lift (NiOverride) as part of the height difference: 1 = on, 0 = off
bHeelAware = 1
; standing actors get their heel lift back when OStim removed it (shoes sinking into the floor): 1 = on, 0 = off
bRestoreHeels = 1

; 0 = realtime: follow the correction every frame (smoothed)
; 1 = stage:    average the correction over the first seconds of each stage, then hold it (steadier)
iMode = 1

; stage mode: wait this long after a scene change before sampling (OStim re-positions actors first)
fSettleSeconds = 0.4
; stage mode: how long to sample (about one animation loop)
fSampleSeconds = 1.5

; smoothing time constant in seconds for moving to a new offset (0 = jump)
fSmoothSeconds = 0.25

; who moves:
; 0 = split between all actors   1 = shorter actors move (tallest stays)
; 2 = taller actors move (shortest stays)   3 = NPCs move, the player stays
iMoveMode = 0

; overall strength (1.0 = full correction)
fStrength = 1.0
; extra multipliers for horizontal (X/Y) and vertical (Z) correction
fHorizontalScale = 1.0
fVerticalScale = 1.0

; never move an actor further than this (game units, ~1.43 cm each; 0 = no limit)
fMaxOffset = 40.0

; actors whose skeleton scale is within this of 1.0 are treated as reference height
fMinHeightDiff = 0.01

; an actor whose lowest foot/calf bone is within this many units (x skeleton scale) of the
; floor counts as standing/kneeling/lying on the floor; such actors are not moved vertically,
; so nobody sinks into the ground or floats. Lifted/held actors still move freely.
fGroundedHeight = 20.0
; without leg IK: how much grounded actors may still move vertically (0 = never, 1 = like lifted actors)
fGroundedZMobility = 0.0

; pelvis or chest within this many units (x scale) of the floor = lying/sitting on the floor;
; such actors are never moved vertically
fLyingHeight = 22.0

[LegIK]
; 1 = a standing actor that is too tall gets lowered by bending the knees (feet stay planted)
bEnabled = 1
; maximum lowering in game units (x skeleton scale)
fMaxDrop = 25.0

; 1 = a kneeling actor (incl. sitting on heels) that is too low gets raised by straightening the
; thighs; knees and feet stay planted. Used for oral/boobjob with a standing partner, etc.
bKneelLift = 1
; when a standing actor could bend down AND a kneeling one could rise, the kneeling one takes this
; share of the height difference (0.75 = kneeling 75%, standing 25%)
fKneelRiseShare = 0.75
; knee bone at most this high (x scale) above the floor = kneeling
fKneelHeight = 12.0
; ...and hips at least this high (x scale), so lying actors are not treated as kneeling
fKneelMinHipHeight = 18.0
; maximum raise for a kneeling actor (x scale); also limited by how upright the thighs can get
fMaxKneelRise = 15.0
; chest must be at least this much (x scale) above the pelvis to count as kneeling
; (excludes lying and all-fours poses)
fKneelTorsoUp = 15.0

[ArmIK]
; 1 = touching hands (groping, stroking the head, holding, fingering, handjob ...) are bent so they
; reach the partner's body part despite the height difference
bEnabled = 1
; a hand counts as touching when it is within this many units (x scale) of the target at
; reference height; it fades out up to 1.5x this distance
fReach = 15.0
; maximum hand correction (x scale)
fMaxShift = 40.0
; smoothing time constant for the hand correction (breast physics jitter)
fSmoothSeconds = 0.12
; how much the hand turns with the bent forearm (0 = hand keeps its animated world angle,
; 1 = hand keeps its animated wrist bend)
fWristFollow = 0.0
; the wrist never bends more than this many degrees away from its animated bend
fMaxWristAngle = 45.0
; the elbow may swing up to this many degrees around the shoulder-hand line to keep the hand at its
; animated angle with a natural wrist (0 = always use the animated elbow direction)
fElbowSwivel = 60.0
; the upper body leans so the reaching shoulders travel this share of the hand correction
; (0 = arms only, 1 = the shoulders move as far as the hand)
fSpineLean = 0.5
; maximum upper-body lean in degrees
fMaxSpineLean = 25.0
; extra offset for hands on breasts (units at height 1.0): + = up / away from the chest
fBreastUp = 3
fBreastForward = 0

[Creatures]
; 1 = scenes with creatures (OCreatures etc.) are aligned too: the creature is never moved or bent,
;     the human actors adapt to it (body offset, leg IK, arm IK). 0 = creature scenes are left alone.
bEnabled = 1
; creature height: 0 = counts as the animation's reference size (1.0), 1 = measured skeleton scale
iHeightMode = 0

[Debug]
; log solved and applied offsets once per second to OStimAnchorAlign.log
bVerboseLog = 0

; where the per-frame work runs: 1 = main thread (default), 0 = HUD advance (0.4.0 and older)
iUpdateHook = 1
